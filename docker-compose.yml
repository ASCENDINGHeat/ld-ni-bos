services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pc_store_app
    ports:
      - "8000:10000"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_NAME=${APP_NAME:-PC Store}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=pcstore
      - DB_USERNAME=pcstore
      - DB_PASSWORD=secret
      - RUN_MIGRATIONS=true
      - RUN_SEED=true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: pc_store_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pcstore
      POSTGRES_USER: pcstore
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcstore -d pcstore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
