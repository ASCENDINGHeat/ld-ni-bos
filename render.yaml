services:
  # ===========================================================================
  # Web Service (Laravel 12 + React 19 Frontend)
  # ===========================================================================
  - type: web
    name: pc-store
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "PC Store"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: pc-store-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "true"
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

# =============================================================================
# Managed PostgreSQL Database (Free Tier)
# =============================================================================
databases:
  - name: pc-store-db
    plan: free
    region: oregon
    databaseName: pcstore
    user: pcstore
